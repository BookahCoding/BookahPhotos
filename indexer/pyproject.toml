[project]
name = "bookahphotos-indexer"
version = "0.1.0"
description = "BookahPhotos indexer: lists photos in Nextcloud and publishes an index snapshot (Phase 1: metadata only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pillow>=11",
    "pillow-heif>=0.20",
    "tzdata",
    "thumbhash>=0.1.2",
]

[project.optional-dependencies]
# Phase 4: reading the content of the photos (search vectors, tags, faces). Not needed for listing and publishing.
content = [
    "onnxruntime-directml==1.24.4",
    "numpy>=2",
    "tokenizers>=0.21",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "regex>=2024.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookahphotos_indexer"]

[project.scripts]
bookahphotos-indexer = "bookahphotos_indexer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
